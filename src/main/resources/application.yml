spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/securitydb
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 6379
      # password: your-password
      timeout: 2000ms
  cache:
    type: redis
    cache-names: usersByUsername
    redis:
      time-to-live: 600000 # 10 dakika
      cache-null-values: false
      use-key-prefix: true
      key-prefix: "spring-security-new-2026:"

app:
  jwt:
    secret: "change-this-secret-key-to-a-very-long-random-string-at-least-64-bytes-for-hs512-change-me"
    access-token-expiration-ms: 900000      # 15 minutes
    refresh-token-expiration-ms: 604800000  # 7 days

